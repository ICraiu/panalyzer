[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "project-analyzer"
version = "0.1.0"
description = "CLI tool to scan Python projects and map method references"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9.0",
    "pydantic>=2.0.0",
    "PyYAML>=6.0",
    "libcst>=1.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
panalyzer = "project_analyzer.cli:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
project_analyzer = ["web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
